services:
  database:
    image: postgis/postgis:18-3.7
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-ambulance_db}
      POSTGRES_USER: ${POSTGRES_USER:-ambulance_demo}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in the project .env file}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5433}:5432"
    volumes:
      - postgis_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-ambulance_demo}:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in the project .env file}@database:5432/${POSTGRES_DB:-ambulance_db}
      PORT: 5000
      AUTH_SECRET: ${AUTH_SECRET:-change-this-local-auth-secret}
    ports:
      - "127.0.0.1:5000:5000"
    depends_on:
      database:
        condition: service_healthy
      backend-init:
        condition: service_completed_successfully

  backend-init:
    build:
      context: ./backend
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-ambulance_demo}:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in the project .env file}@database:5432/${POSTGRES_DB:-ambulance_db}
    depends_on:
      database:
        condition: service_healthy
    command: sh -c "npm run db:migrate && npm run db:seed && npm run auth:create-user -- admin MediRoute2026! \"Control Room Admin\" admin"
    restart: "no"

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://localhost:5000}
    restart: unless-stopped
    ports:
      - "127.0.0.1:5173:80"
    depends_on:
      - backend

volumes:
  postgis_data:
